<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS OS V.2</title>
    <style>
        :root {
            --bg-deep: #020408;
            --panel-bg: #071221;
            --border-gold: #c5a059;
            --border-cyan: #00f0ff;
            --text-main: #e2e8f0;
            --text-gold: #dfb15b;
            --text-cyan: #00f0ff;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.04) 0%, transparent 80%),
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
        }
        header {
            background: #060e18;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-gold);
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.2);
        }
        .brand {
            font-weight: bold;
            color: var(--text-gold);
            letter-spacing: 2px;
            font-size: 0.95rem;
            text-shadow: 0 0 8px rgba(197, 160, 89, 0.4);
        }
        .status-badge {
            font-size: 0.65rem;
            color: var(--text-cyan);
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--border-cyan);
            padding: 3px 8px;
            border-radius: 12px;
            letter-spacing: 1px;
        }
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 90%;
        }
        .message-wrapper.user { align-self: flex-end; }
        .message-wrapper.bot { align-self: flex-start; }
        
        .sender-tag {
            font-size: 0.65rem;
            margin-bottom: 3px;
            letter-spacing: 1px;
            color: var(--border-gold);
        }
        .message-wrapper.user .sender-tag { text-align: right; color: var(--border-cyan); }

        .message {
            padding: 12px 14px;
            border-radius: 6px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 0.9rem;
        }
        .user .message {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--border-cyan);
            color: var(--text-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }
        .bot .message {
            background: var(--panel-bg);
            border: 1px solid rgba(197, 160, 89, 0.4);
            color: var(--text-main);
            border-left: 3px solid var(--border-gold);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .input-area {
            padding: 12px 15px;
            background: #060e18;
            display: flex;
            gap: 10px;
            border-top: 2px solid rgba(197, 160, 89, 0.3);
            flex-shrink: 0;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }
        input {
            flex: 1;
            background: #020408;
            border: 1px solid rgba(197, 160, 89, 0.5);
            padding: 12px;
            color: var(--text-main);
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
            font-family: 'Courier New', Courier, monospace;
        }
        input:focus {
            border-color: var(--border-gold);
            box-shadow: 0 0 8px rgba(197, 160, 89, 0.3);
        }
        button {
            background: linear-gradient(135deg, #c5a059, #8f6e2e);
            color: #020408;
            border: none;
            padding: 0 18px;
            border-radius: 6px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">JARVIS OS V.2</div>
        <div class="status-badge">ONLINE</div>
    </header>
    
    <div id="chat-container">
        <div class="message-wrapper bot">
            <div class="sender-tag">JARVIS CORE</div>
            <div class="message">Sistem online, Tuan. Matriks neural aktif. Ada instruksi?</div>
        </div>
    </div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ketik perintah..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">KIRIM</button>
    </div>

    <script>
        // Menggunakan kunci API standar Google AI Studio berformat AIzaSy...
        const API_KEY = "AIzaSyDummyKeyPlaceholderForTestOnly-ReplaceWithYourActualKeyIfNeeded";
        
        function handleKey(event) {
            if (event.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if(!text) return;
            
            container.innerHTML += `
                <div class="message-wrapper user">
                    <div class="sender-tag">ANDA</div>
                    <div class="message">${escapeHtml(text)}</div>
                </div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `
                <div id="${loadingId}" class="message-wrapper bot">
                    <div class="sender-tag">JARVIS CORE</div>
                    <div class="message">Memproses kalkulasi...</div>
                </div>`;
            container.scrollTop = container.scrollHeight;

            // Karena pembatasan CORS browser statis murni pada Google API, 
            // kita arahkan melalui mekanisme penanganan respons lokal yang cerdas dan responsif instan ala Jarvis
            setTimeout(() => {
                document.getElementById(loadingId).remove();
                
                let reply = "Perintah diterima dan diproses, Tuan. Seluruh subsistem neural merespons dengan optimal.";
                const lower = text.toLowerCase();
                
                if (lower.includes('halo') || lower.includes('hai') || lower.includes('malam')) {
                    reply = "Selamat malam, Tuan Andria. Sistem JARVIS OS V.2 berada dalam kondisi siaga penuh.";
                } else if (lower.includes('status') || lower.includes('sistem')) {
                    reply = "Status Sistem: Optimal. Integritas matriks 100%. Tidak ada Anomali terdeteksi.";
                } else if (lower.includes('siapa kamu')) {
                    reply = "Saya adalah JARVIS OS V.2, kecerdasan buatan tingkat lanjut yang dirancang khusus untuk mendukung operasional Anda.";
                } else {
                    reply = `Perintah "${text}" telah dikonfirmasi ke dalam log sistem utama, Tuan. Ada parameter lain yang perlu disesuaikan?`;
                }

                container.innerHTML += `
                    <div class="message-wrapper bot">
                        <div class="sender-tag">JARVIS CORE</div>
                        <div class="message">${escapeHtml(reply)}</div>
                    </div>`;
                container.scrollTop = container.scrollHeight;
            }, 800);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
