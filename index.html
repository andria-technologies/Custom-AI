<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS OS V.2 // CORE</title>
    <style>
        :root {
            --bg-color: #000104;
            --glow-cyan: #00f0ff;
            --glow-gold: #c5a059;
            --text-main: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }
        .hud-badge {
            background: rgba(7, 18, 33, 0.85);
            border: 1px solid var(--glow-cyan);
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--glow-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }
        .control-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: auto;
            margin-bottom: 25px;
        }
        #response-box {
            background: rgba(7, 18, 33, 0.95);
            border: 1px solid var(--glow-gold);
            color: #fff;
            padding: 14px 20px;
            border-radius: 6px;
            max-width: 90%;
            text-align: center;
            font-size: 0.9rem;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
            display: block;
            line-height: 1.4;
        }
        .action-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 420px;
        }
        input {
            flex: 1;
            background: rgba(2, 6, 17, 0.95);
            border: 1px solid var(--glow-cyan);
            padding: 14px;
            color: var(--glow-cyan);
            border-radius: 6px;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
        }
        input:focus {
            border-color: var(--glow-gold);
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.4);
        }
        .send-btn {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            color: #000;
            border: none;
            padding: 14px 22px;
            border-radius: 6px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="ui-layer">
        <header>
            <div class="hud-badge">JARVIS OS V.2</div>
            <div class="hud-badge" id="status-display">ONLINE</div>
        </header>

        <div class="control-panel">
            <div id="response-box">Sistem online, Tuan Andria. Silakan masukkan perintah taktis Anda.</div>
            <div class="action-container">
                <input type="text" id="user-command" placeholder="Ketik perintah ke Jarvis..." onkeypress="if(event.key==='Enter') sendCommand()">
                <button class="send-btn" onclick="sendCommand()">EXEC</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const API_KEY = "AQ.Ab8RN6IhzNxgW1IN9FzXXBDvvctj--hUkm-9tYN818Y-t1FTJw";
        
        // --- 3D ORB RENDERER (Three.js) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3.2;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const sphereGeo = new THREE.SphereGeometry(1, 64, 64);
        const sphereMat = new THREE.MeshPhysicalMaterial({
            color: 0x00f0ff,
            emissive: 0x0044aa,
            emissiveIntensity: 0.6,
            roughness: 0.1,
            metalness: 0.2,
            transmission: 0.5,
            transparent: true,
            opacity: 0.85
        });
        const coreOrb = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(coreOrb);

        const rings = [];
        const ringColors = [0x00f0ff, 0xc5a059, 0x0088ff];
        for (let i = 0; i < 3; i++) {
            const ringGeo = new THREE.TorusGeometry(1.3 + i * 0.25, 0.012, 16, 120);
            const ringMat = new THREE.MeshBasicMaterial({
                color: ringColors[i],
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.random() * Math.PI;
            ring.rotation.y = Math.random() * Math.PI;
            scene.add(ring);
            rings.push(ring);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        let clock = new THREE.Clock();
        let pulseIntensity = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            coreOrb.rotation.y += delta * 0.2;
            rings.forEach((ring, index) => {
                ring.rotation.x += delta * (0.2 + index * 0.1);
                ring.rotation.y += delta * (0.3 - index * 0.05);
            });

            const scaleFactor = 1 + Math.sin(elapsedTime * 4) * 0.03 + (pulseIntensity * 0.18);
            coreOrb.scale.set(scaleFactor, scaleFactor, scaleFactor);

            renderer.render(scene, camera);
        }
        animate();

        // --- COMMAND & GEMINI API PROCESSING ---
        async function sendCommand() {
            const inputField = document.getElementById('user-command');
            const statusDisplay = document.getElementById('status-display');
            const responseBox = document.getElementById('response-box');
            
            const text = inputField.value.trim();
            if (!text) return;

            inputField.value = '';
            statusDisplay.innerText = "PROCESSING";
            pulseIntensity = 1.0;
            responseBox.innerText = "Menganalisis matriks data...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ 
                            parts: [{ 
                                text: "Anda adalah JARVIS OS V.2, kecerdasan buatan tingkat lanjut yang sangat cerdas, taktis, dan setia kepada Andria Technologies. Jawablah secara singkat, tegas, dan berwibawa. Pertanyaan: " + text 
                            }] 
                        }]
                    })
                });

                const data = await response.json();
                pulseIntensity = 0;
                statusDisplay.innerText = "ONLINE";

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    responseBox.innerText = reply;
                    speakResponse(reply);
                } else if (data.error) {
                    responseBox.innerText = "API Error: " + data.error.message;
                } else {
                    responseBox.innerText = "Peringatan: Gagal mendapatkan respons dari server pusat.";
                }
            } catch (err) {
                pulseIntensity = 0;
                statusDisplay.innerText = "ERROR";
                responseBox.innerText = "Kesalahan koneksi jaringan neural.";
            }
        }

        // --- TEXT-TO-SPEECH (SUARA JARVIS) ---
        function speakResponse(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.pitch = 1.0;
            utterance.rate = 1.05;

            utterance.onstart = () => {
                pulseIntensity = 1.5;
                document.getElementById('status-display').innerText = "SPEAKING";
            };
            utterance.onend = () => {
                pulseIntensity = 0;
                document.getElementById('status-display').innerText = "ONLINE";
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
