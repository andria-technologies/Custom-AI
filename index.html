<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS OS V.2 // SECURE HUD</title>
    <style>
        :root {
            --bg-deep: #010409;
            --panel-bg: #0d1117;
            --border-gold: #c5a059;
            --border-cyan: #00f0ff;
            --text-main: #c9d1d9;
            --text-gold: #f0b753;
            --text-cyan: #58a6ff;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        header {
            background: var(--panel-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-gold);
        }
        .brand {
            font-weight: 700;
            color: var(--text-gold);
            letter-spacing: 2px;
            font-size: 0.95rem;
        }
        .status {
            font-size: 0.75rem;
            color: var(--text-cyan);
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid var(--text-cyan);
            padding: 3px 10px;
            border-radius: 4px;
        }
        #terminal-screen {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .log-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .log-group.user { align-items: flex-end; }
        .log-group.system { align-items: flex-start; }
        
        .log-header {
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: var(--border-gold);
        }
        .log-group.user .log-header { color: var(--text-cyan); }

        .log-body {
            background: var(--panel-bg);
            border: 1px solid rgba(197, 160, 89, 0.3);
            padding: 12px 16px;
            border-radius: 6px;
            max-width: 85%;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .log-group.user .log-body {
            background: rgba(88, 166, 255, 0.08);
            border-color: var(--text-cyan);
            color: var(--text-cyan);
        }
        .command-console {
            padding: 15px 20px;
            background: var(--panel-bg);
            display: flex;
            gap: 12px;
            border-top: 2px solid var(--border-gold);
        }
        input {
            flex: 1;
            background: #010409;
            border: 1px solid rgba(197, 160, 89, 0.5);
            padding: 12px 16px;
            color: var(--text-main);
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
        }
        input:focus {
            border-color: var(--border-cyan);
        }
        button {
            background: var(--border-gold);
            color: #010409;
            border: none;
            padding: 0 24px;
            border-radius: 6px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">JARVIS OS V.2 // CORE</div>
        <div class="status">ACTIVE</div>
    </header>
    
    <div id="terminal-screen">
        <div class="log-group system">
            <div class="log-header">SYSTEM KERNEL</div>
            <div class="log-body">Inisialisasi sistem berhasil. Protokol keamanan dan matriks neural online. Silakan masukkan perintah, Tuan.</div>
        </div>
    </div>
    
    <div class="command-console">
        <input type="text" id="command-input" placeholder="Ketik perintah sistem..." onkeypress="if(event.key==='Enter') executeCommand()">
        <button onclick="executeCommand()">KIRIM</button>
    </div>

    <script>
        function executeCommand() {
            const input = document.getElementById('command-input');
            const screen = document.getElementById('terminal-screen');
            const text = input.value.trim();
            if(!text) return;
            
            // Append User Input
            screen.innerHTML += `
                <div class="log-group user">
                    <div class="log-header">ADMINISTRATOR</div>
                    <div class="log-body">${escapeHTML(text)}</div>
                </div>`;
            input.value = '';
            screen.scrollTop = screen.scrollHeight;

            // Simulated Professional Response
            const loadingId = 'sys-' + Date.now();
            screen.innerHTML += `
                <div id="${loadingId}" class="log-group system">
                    <div class="log-header">JARVIS CORE</div>
                    <div class="log-body">Memproses parameter...</div>
                </div>`;
            screen.scrollTop = screen.scrollHeight;

            setTimeout(() => {
                document.getElementById(loadingId).remove();
                
                let responseText = "Perintah telah dikonfirmasi dan dimasukkan ke dalam antrean eksekusi sistem utama.";
                const query = text.toLowerCase();

                if (query.includes('halo') || query.includes('selamat')) {
                    responseText = "Selamat malam, Tuan. Seluruh subsistem beroperasi pada kapasitas penuh tanpa anomali.";
                } else if (query.includes('status') || query.includes('diagnostik')) {
                    responseText = "Diagnostik Sistem:\n- Neural Core: 100% Optimal\n- Latensi Jaringan: 14ms\n- Keamanan Enkripsi: Aktif";
                } else if (query.includes('andria')) {
                    responseText = "Identitas terverifikasi: Andria Technologies. Hak akses tingkat tertinggi diberikan.";
                }

                screen.innerHTML += `
                    <div class="log-group system">
                        <div class="log-header">JARVIS CORE</div>
                        <div class="log-body">${escapeHTML(responseText)}</div>
                    </div>`;
                screen.scrollTop = screen.scrollHeight;
            }, 600);
        }

        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
