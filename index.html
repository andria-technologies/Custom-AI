<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS OS V.2</title>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0d1117">
    <style>
        :root {
            --bg-color: #050b14;
            --panel-bg: #0d1624;
            --border-color: #1f3a5f;
            --accent-glow: #00ffcc;
            --text-main: #c9d1d9;
            --text-accent: #00ffcc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: var(--panel-bg);
            padding: 12px 20px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            font-weight: bold;
            color: var(--text-accent);
            letter-spacing: 2px;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }
        #system-status {
            font-size: 0.75rem;
            color: #8b949e;
            text-align: center;
            background: #080f1a;
            padding: 4px;
            border-bottom: 1px solid var(--border-color);
        }
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 4px;
            max-width: 85%;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }
        .user {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--accent-glow);
            color: var(--text-accent);
            align-self: flex-end;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
        }
        .bot {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            align-self: flex-start;
        }
        .input-area {
            padding: 15px;
            background: var(--panel-bg);
            display: flex;
            gap: 10px;
            border-top: 2px solid var(--border-color);
        }
        input {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            color: var(--text-accent);
            border-radius: 4px;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
        }
        input:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
        }
        button {
            background: rgba(0, 255, 204, 0.2);
            color: var(--text-accent);
            border: 1px solid var(--accent-glow);
            padding: 0 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.3s ease;
        }
        button:hover {
            background: var(--accent-glow);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }
    </style>
</head>
<body>
    <header>JARVIS OS V.2 // CORE INTERFACE</header>
    <div id="system-status">STATUS: ONLINE // NEURAL LINK ACTIVE</div>
    
    <div id="chat-container">
        <div class="message bot">JARVIS OS V.2 online. Sistem siap menerima perintah, Tuan. Ada yang bisa saya bantu?</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Masukkan perintah untuk Jarvis..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">KIRIM</button>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6IhzNxgW1IN9FzXXBDvvctj--hUkm-9tYN818Y-t1FTJw";
        
        function handleKey(event) {
            if (event.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if(!text) return;
            
            container.innerHTML += `<div class="message user">> ${escapeHtml(text)}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div id="${loadingId}" class="message bot">Mengakses protokol neural...</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ 
                            parts: [{ 
                                text: "Anda adalah JARVIS OS V.2, sistem kecerdasan buatan tingkat lanjut yang canggih, loyal, dan efisien. Jawablah dengan gaya bahasa yang profesional, sigap, dan bernuansa futuristik ala asisten pribadi tingkat tinggi. Pertanyaan/perintah pengguna: " + text 
                            }] 
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    container.innerHTML += `<div class="message bot">${escapeHtml(reply)}</div>`;
                } else {
                    container.innerHTML += `<div class="message bot">Peringatan: Gagal mendapatkan respons dari inti neural.</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message bot">Kesalahan koneksi sistem terdeteksi.</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
