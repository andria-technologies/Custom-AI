<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS OS V.2 // HUD INTERFACE</title>
    <style>
        :root {
            --bg-color: #020611;
            --hud-cyan: #00f0ff;
            --hud-gold: #f3b73e;
            --hud-blue: #1e3a8a;
            --panel-bg: rgba(2, 12, 27, 0.85);
            --text-main: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 80%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }
        /* Top HUD Bar */
        header {
            background: linear-gradient(180deg, rgba(4, 15, 33, 0.95), rgba(2, 6, 17, 0.9));
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--hud-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            flex-shrink: 0;
        }
        .brand {
            font-weight: bold;
            color: var(--hud-cyan);
            letter-spacing: 3px;
            font-size: 1rem;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .hud-status {
            font-size: 0.7rem;
            color: var(--hud-gold);
            border: 1px solid var(--hud-gold);
            padding: 2px 8px;
            border-radius: 4px;
            box-shadow: 0 0 8px rgba(243, 183, 62, 0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        /* HUD Core Display Area */
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .hud-box {
            background: var(--panel-bg);
            border: 1px solid var(--hud-cyan);
            border-left: 4px solid var(--hud-cyan);
            padding: 12px 15px;
            border-radius: 4px;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.1), 0 0 10px rgba(0, 240, 255, 0.15);
            max-width: 90%;
            position: relative;
        }
        .hud-box.user {
            align-self: flex-end;
            border-color: var(--hud-gold);
            border-left-color: var(--hud-gold);
            border-left: 1px solid var(--hud-gold);
            border-right: 4px solid var(--hud-gold);
            box-shadow: inset 0 0 15px rgba(243, 183, 62, 0.1), 0 0 10px rgba(243, 183, 62, 0.15);
        }
        .hud-box.bot {
            align-self: flex-start;
        }
        .sender-id {
            font-size: 0.65rem;
            color: var(--hud-cyan);
            margin-bottom: 4px;
            letter-spacing: 2px;
        }
        .user .sender-id {
            color: var(--hud-gold);
            text-align: right;
        }
        .message-content {
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        /* Bottom Control Panel */
        .input-panel {
            background: rgba(2, 12, 27, 0.95);
            padding: 12px 15px;
            display: flex;
            gap: 10px;
            border-top: 2px solid var(--hud-cyan);
            box-shadow: 0 -5px 20px rgba(0, 240, 255, 0.2);
            flex-shrink: 0;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }
        input {
            flex: 1;
            background: #01060e;
            border: 1px solid var(--hud-cyan);
            padding: 12px;
            color: var(--hud-cyan);
            border-radius: 4px;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.2);
        }
        input:focus {
            border-color: var(--hud-gold);
            color: var(--hud-gold);
            box-shadow: inset 0 0 12px rgba(243, 183, 62, 0.3);
        }
        button {
            background: rgba(0, 240, 255, 0.15);
            color: var(--hud-cyan);
            border: 1px solid var(--hud-cyan);
            padding: 0 20px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        button:active {
            background: var(--hud-cyan);
            color: var(--bg-color);
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">JARVIS // OS V.2</div>
        <div class="hud-status">SYS.ONLINE</div>
    </header>
    
    <div id="chat-container">
        <div class="hud-box bot">
            <div class="sender-id">[SYSTEM CORE]</div>
            <div class="message-content">Matriks neural JARVIS V.2 aktif sepenuhnya. Seluruh protokol siap dijalankan, Tuan. Ada instruksi?</div>
        </div>
    </div>
    
    <div class="input-panel">
        <input type="text" id="user-input" placeholder="Masukkan perintah sistem..." onkeypress="handleKey(event)">
        <button onclick="sendToJarvis()">EXEC</button>
    </div>

    <script>
        // Menggunakan server proxy publik gratis untuk merutekan API Gemini secara aman dari browser statis
        async function sendToJarvis() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if(!text) return;
            
            // Tampilkan pesan user
            container.innerHTML += `
                <div class="hud-box user">
                    <div class="sender-id">[ADMIN / ANDRIA]</div>
                    <div class="message-content">${escapeHtml(text)}</div>
                </div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // Indikator loading HUD
            const loadId = 'load-' + Date.now();
            container.innerHTML += `
                <div id="${loadId}" class="hud-box bot">
                    <div class="sender-id">[SYSTEM CORE]</div>
                    <div class="message-content">Memproses kalkulasi matriks neural...</div>
                </div>`;
            container.scrollTop = container.scrollHeight;

            try {
                // Permintaan langsung menggunakan endpoint publik dengan kunci aman
                const apiKey = "AQ.Ab8RN6IhzNxgW1IN9FzXXBDvvctj--hUkm-9tYN818Y-t1FTJw";
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ 
                            parts: [{ 
                                text: "Anda adalah JARVIS OS V.2, sistem kecerdasan buatan tingkat lanjut yang sangat cerdas, setia, taktis, dan futuristik. Jawablah secara lugas, profesional, dan berwibawa layaknya asisten tingkat tinggi Tony Stark. Perintah: " + text 
                            }] 
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    container.innerHTML += `
                        <div class="hud-box bot">
                            <div class="sender-id">[JARVIS V.2]</div>
                            <div class="message-content">${escapeHtml(reply)}</div>
                        </div>`;
                } else {
                    container.innerHTML += `
                        <div class="hud-box bot">
                            <div class="sender-id">[SYSTEM ERROR]</div>
                            <div class="message-content">Peringatan: Gagal mendapatkan respons dari inti neural.</div>
                        </div>`;
                }
            } catch (err) {
                document.getElementById(loadId).remove();
                container.innerHTML += `
                    <div class="hud-box bot">
                        <div class="sender-id">[SYSTEM ERROR]</div>
                        <div class="message-content">Koneksi jaringan terputus dari server inti.</div>
                    </div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendToJarvis();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
