<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS OS V.2 // REALITY CORE</title>
    <style>
        :root {
            --bg-color: #000103;
            --glow-blue: #00f0ff;
            --deep-blue: #0a1429;
            --text-color: #e0f7fa;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #overlay-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud-element {
            background: rgba(10, 20, 41, 0.6);
            border: 1px solid var(--glow-blue);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }
        .top-hud {
            display: flex;
            justify-content: space-between;
        }
        .bottom-hud {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #status-text {
            color: var(--glow-blue);
            text-shadow: 0 0 10px var(--glow-blue);
        }
        #voice-command-display {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #fff;
            color: #fff;
            padding: 15px;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 0.5s;
            max-width: 80%;
            text-align: center;
        }
        #mic-button {
            pointer-events: auto;
            background: transparent;
            border: 3px solid var(--glow-blue);
            color: var(--glow-blue);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #mic-button:hover {
            background: rgba(0, 240, 255, 0.2);
        }
        #mic-button.listening {
            background: #ff0000;
            border-color: #ff0000;
            color: #fff;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.9);
            animation: pulse-mic 1.5s infinite;
        }
        @keyframes pulse-mic {
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 0, 0, 0.8); }
            50% { transform: scale(1.1); box-shadow: 0 0 50px rgba(255, 0, 0, 1); }
            100% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 0, 0, 0.8); }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="overlay-ui">
        <div class="top-hud">
            <div class="hud-element">JARVIS // OS V.2 REALITY CORE</div>
            <div class="hud-element" id="status-text">STATUS: OFFLINE</div>
        </div>
        <div class="bottom-hud">
            <div id="voice-command-display" class="hud-element"></div>
            <button id="mic-button">MIC</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- THREE.JS VISUALIZATION ---
        const canvasContainer = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        canvasContainer.appendChild(renderer.domElement);

        // --- Orb Shader ---
        const uniforms = {
            time: { value: 1.0 },
            audioEnergy: { value: 0.0 }
        };

        const orbGeometry = new THREE.IcosahedronGeometry(1, 6);
        const orbMaterial = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: `
                uniform float time;
                uniform float audioEnergy;
                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vViewPosition;

                #define PI 3.14159265359

                void main() {
                    vUv = uv;
                    vNormal = normal;
                    
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vViewPosition = cameraPosition - worldPosition.xyz;

                    float noise = 0.0;
                    noise += sin(position.x * 8.0 + time * 2.0) * cos(position.y * 6.0 - time * 1.5) * 0.06;
                    noise += sin(position.y * 15.0 + time * 3.0) * cos(position.z * 10.0 + time * 1.0) * 0.04;
                    noise *= (1.0 + audioEnergy * 4.0);

                    vec3 newPosition = position + normal * noise;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform float audioEnergy;
                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vViewPosition;

                #define COLOR_CORE vec3(0.0, 0.1, 0.2)
                #define COLOR_GLOW vec3(0.0, 0.9, 1.0)

                void main() {
                    vec3 normal = normalize(vNormal);
                    vec3 viewDir = normalize(vViewPosition);
                    float rim = 1.0 - max(dot(normal, viewDir), 0.0);
                    
                    float pulse = 0.8 + 0.2 * sin(time * 3.0);
                    
                    vec3 color = mix(COLOR_CORE, COLOR_GLOW, pow(rim, 3.0) * (1.5 + audioEnergy * 5.0) * pulse);
                    
                    float alpha = 0.5 + 0.5 * pow(rim, 2.0) + audioEnergy * 2.0;
                    alpha = clamp(alpha, 0.2, 0.9);

                    gl_FragColor = vec4(color, alpha);
                }
            `,
            transparent: true,
            depthWrite: false
        });

        const orb = new THREE.Mesh(orbGeometry, orbMaterial);
        scene.add(orb);

        // --- Rings ---
        const rings = [];
        for (let i = 0; i < 4; i++) {
            const geometry = new THREE.TorusGeometry(1.3 + i * 0.2, 0.015, 16, 100);
            const material = new THREE.MeshBasicMaterial({ 
                color: new THREE.Color(0x00f0ff),
                transparent: true,
                opacity: 0.2 + i * 0.1,
                blending: THREE.AdditiveBlending
            });
            const ring = new THREE.Mesh(geometry, material);
            ring.rotation.x = Math.random() * Math.PI;
            ring.rotation.y = Math.random() * Math.PI;
            scene.add(ring);
            rings.push(ring);
        }

        // --- Background Particles ---
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1000;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i=0; i<particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 5;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.005,
            color: 0x00f0ff,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // --- Resize Handler ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Animation Loop ---
        let clock = new THREE.Clock();
        let audioEnergyTarget = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            uniforms.time.value += delta;
            
            // Smoothly interpolate audio energy
            uniforms.audioEnergy.value += (audioEnergyTarget - uniforms.audioEnergy.value) * 0.15;

            orb.rotation.y += delta * 0.05;
            rings.forEach((ring, i) => {
                ring.rotation.x += delta * (0.1 * (i + 1));
                ring.rotation.y += delta * (0.15 * (i + 1));
            });
            particlesMesh.rotation.y += delta * 0.01;

            renderer.render(scene, camera);
        }
        animate();

        // --- AUDIO RECOGNITION & SYNTHESIS (JARVIS CORE) ---
        const API_KEY = "AQ.Ab8RN6IhzNxgW1IN9FzXXBDvvctj--hUkm-9tYN818Y-t1FTJw";
        const micButton = document.getElementById('mic-button');
        const statusText = document.getElementById('status-text');
        const voiceDisplay = document.getElementById('voice-command-display');

        // Check browser support
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert("Web Speech API tidak didukung di browser ini. Gunakan Google Chrome.");
            micButton.style.display = 'none';
            statusText.innerText = "BROWSER ERROR";
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.lang = 'id-ID';
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        // Setup Audio Visualizer
        let audioContext, analyser, dataArray;
        let isListening = false;

        async function setupAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                visualizeAudio();
            } catch (err) {
                console.error("Gagal mengakses mikrofon:", err);
                statusText.innerText = "MIC ACCESS DENIED";
            }
        }

        function visualizeAudio() {
            if (!isListening) {
                audioEnergyTarget = 0;
                return;
            }
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const average = sum / dataArray.length;
            audioEnergyTarget = average / 128.0; // Normalize to 0.0 - 1.0
            requestAnimationFrame(visualizeAudio);
        }

        // Recognition Events
        recognition.onstart = () => {
            isListening = true;
            micButton.classList.add('listening');
            statusText.innerText = "STATUS: LISTENING";
            voiceDisplay.style.opacity = '1';
            voiceDisplay.innerText = "Listening...";
            if (!audioContext) setupAudio();
        };

        recognition.onend = () => {
            isListening = false;
            micButton.classList.remove('listening');
            statusText.innerText = "STATUS: ONLINE";
            visualizeAudio(); // Stop visualizer loop
        };

        recognition.onresult = (event) => {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                }
            }
            if (finalTranscript) {
                voiceDisplay.innerText = `Anda: "${finalTranscript}"`;
                processJarvisCommand(finalTranscript);
            }
        };

        recognition.onerror = (event) => {
            console.error("Speech recognition error:", event.error);
            statusText.innerText = "RECOGNITION ERROR";
            micButton.classList.remove('listening');
        };

        micButton.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        // --- JARVIS COMMAND LOGIC & GEMINI API ---
        async function processJarvisCommand(command) {
            const lowerCommand = command.toLowerCase();
            
            // Hardcoded local commands for instant response
            if (lowerCommand.includes('halo') || lowerCommand.includes('hai')) {
                speakJarvis("Selamat malam, Tuan Andria Technologies. Sistem neural aktif.");
                return;
            } else if (lowerCommand.includes('status')) {
                speakJarvis("Status sistem optimal. Inti realitas online. Tidak ada anomali terdeteksi.");
                return;
            }

            // Call Gemini API for complex queries
            statusText.innerText = "STATUS: PROCESSING";
            audioEnergyTarget = 0.8; // Visual feedback during API call

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ 
                            parts: [{ 
                                text: "Bertindaklah sebagai JARVIS OS V.2, kecerdasan buatan tingkat lanjut yang sangat cerdas, taktis, profesional, dan setia kepada Andria. Berikan respons lisan yang singkat, tegas, dan berwibawa sesuai identitas asisten tinggi Tony Stark. Perintah: " + command 
                            }] 
                        }]
                    })
                });

                const data = await response.json();
                audioEnergyTarget = 0;

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const replyText = data.candidates[0].content.parts[0].text;
                    speakJarvis(replyText);
                } else {
                    speakJarvis("Peringatan: Gagal memproses instruksi neural dari server pusat.");
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
                audioEnergyTarget = 0;
                speakJarvis("Kesalahan koneksi jaringan terdeteksi pada tautan data utama.");
            }
            statusText.innerText = "STATUS: ONLINE";
        }

        // --- TEXT-TO-SPEECH (JARVIS VOICE) ---
        function speakJarvis(text) {
            if (!('speechSynthesis' in window)) {
                alert("Maaf, Text-to-Speech tidak didukung di browser ini.");
                return;
            }

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.pitch = 1.1; // Slightly higher pitch for futuristic sound
            utterance.rate = 1.05; // Slightly faster
            
            // Find a good female voice (often associated with Jarvis's female-sounding system)
            // Fallback to default if not found
            const voices = window.speechSynthesis.getVoices();
            const idVoices = voices.filter(v => v.lang === 'id-ID');
            const targetVoice = idVoices.find(v => v.name.includes('Google') || v.name.includes('Female')) || idVoices[0];
            if (targetVoice) utterance.voice = targetVoice;

            utterance.onstart = () => {
                statusText.innerText = "STATUS: SPEAKING";
                // Make orb pulse rapidly while speaking
                let speakPulse = setInterval(() => {
                    audioEnergyTarget = 0.2 + Math.random() * 0.4;
                }, 50);
                utterance.onend = () => {
                    clearInterval(speakPulse);
                    audioEnergyTarget = 0;
                    statusText.innerText = "STATUS: ONLINE";
                    voiceDisplay.style.opacity = '0'; // Hide command display after speaking
                };
            };

            window.speechSynthesis.speak(utterance);
        }

        // Ensure voices are loaded for selection
        window.speechSynthesis.onvoiceschanged = () => {};

    </script>
</body>
</html>
