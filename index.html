<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis AI Assistant</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #161b22; padding: 15px; text-align: center; border-bottom: 1px solid #30363d; font-weight: bold; color: #58a6ff; }
        #chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
        .user { background: #238636; color: white; align-self: flex-end; }
        .bot { background: #21262d; border: 1px solid #30363d; align-self: flex-start; }
        .input-area { padding: 15px; background: #161b22; display: flex; gap: 10px; border-top: 1px solid #30363d; }
        input { flex: 1; background: #0d1117; border: 1px solid #30363d; padding: 12px; color: white; border-radius: 6px; outline: none; }
        button { background: #238636; color: white; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>JARVIS AI ASSISTANT</header>
    <div id="chat-container">
        <div class="message bot">Halo! Saya Jarvis, siap membantu Anda. Silakan ketik pesan di bawah.</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ketik pesan di sini..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">Kirim</button>
    </div>
    <script>
        const API_KEY = "AQ.Ab8RN6IhzNxgW1IN9FzXXBDvvctj--hUkm-9tYN818Y-t1FTJw";
        
        function handleKey(event) {
            if (event.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if(!text) return;
            
            container.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div id="${loadingId}" class="message bot">Jarvis sedang berpikir...</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    container.innerHTML += `<div class="message bot">${escapeHtml(reply)}</div>`;
                } else {
                    container.innerHTML += `<div class="message bot">Maaf, terjadi kesalahan dalam memproses respons.</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message bot">Gagal terhubung ke server AI.</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
