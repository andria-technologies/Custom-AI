<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS OS V.2</title>
    <style>
        :root {
            --bg-deep: #020408;
            --panel-bg: #071221;
            --border-gold: #c5a059;
            --border-cyan: #00f0ff;
            --text-main: #e2e8f0;
            --text-gold: #dfb15b;
            --text-cyan: #00f0ff;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        header {
            background: #060e18;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-gold);
            flex-shrink: 0;
        }
        .brand {
            font-weight: 800;
            color: var(--text-gold);
            letter-spacing: 2px;
            font-size: 1rem;
        }
        .status-badge {
            font-size: 0.7rem;
            color: var(--text-cyan);
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--border-cyan);
            padding: 3px 8px;
            border-radius: 12px;
        }
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 90%;
        }
        .message-wrapper.user { align-self: flex-end; }
        .message-wrapper.bot { align-self: flex-start; }
        
        .sender-tag {
            font-size: 0.65rem;
            margin-bottom: 3px;
            letter-spacing: 1px;
            color: var(--border-gold);
        }
        .message-wrapper.user .sender-tag { text-align: right; color: var(--text-cyan); }

        .message {
            padding: 12px 14px;
            border-radius: 6px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 0.9rem;
        }
        .user .message {
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid var(--border-cyan);
            color: var(--text-cyan);
        }
        .bot .message {
            background: var(--panel-bg);
            border: 1px solid rgba(197, 160, 89, 0.4);
            color: var(--text-main);
            border-left: 3px solid var(--border-gold);
        }
        .input-area {
            padding: 12px 15px;
            background: #060e18;
            display: flex;
            gap: 10px;
            border-top: 2px solid rgba(197, 160, 89, 0.3);
            flex-shrink: 0;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }
        input {
            flex: 1;
            background: #020408;
            border: 1px solid rgba(197, 160, 89, 0.5);
            padding: 12px;
            color: var(--text-main);
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
        }
        input:focus {
            border-color: var(--border-gold);
        }
        button {
            background: linear-gradient(135deg, #c5a059, #8f6e2e);
            color: #020408;
            border: none;
            padding: 0 18px;
            border-radius: 6px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">JARVIS OS V.2</div>
        <div class="status-badge">ONLINE</div>
    </header>
    
    <div id="chat-container">
        <div class="message-wrapper bot">
            <div class="sender-tag">JARVIS CORE</div>
            <div class="message">Sistem online, Tuan. Ada instruksi khusus untuk hari ini?</div>
        </div>
    </div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ketik perintah..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">KIRIM</button>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6IhzNxgW1IN9FzXXBDvvctj--hUkm-9tYN818Y-t1FTJw";
        
        function handleKey(event) {
            if (event.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if(!text) return;
            
            container.innerHTML += `
                <div class="message-wrapper user">
                    <div class="sender-tag">ANDA</div>
                    <div class="message">${escapeHtml(text)}</div>
                </div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `
                <div id="${loadingId}" class="message-wrapper bot">
                    <div class="sender-tag">JARVIS CORE</div>
                    <div class="message">Memproses...</div>
                </div>`;
            container.scrollTop = container.scrollHeight;

            try {
                // Menggunakan endpoint v1 yang lebih stabil untuk pemanggilan browser langsung
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ 
                            parts: [{ 
                                text: "Anda adalah JARVIS OS V.2, asisten AI tingkat lanjut yang setia dan futuristik. Jawablah secara taktis dan profesional. Pertanyaan: " + text 
                            }] 
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    container.innerHTML += `
                        <div class="message-wrapper bot">
                            <div class="sender-tag">JARVIS CORE</div>
                            <div class="message">${escapeHtml(reply)}</div>
                        </div>`;
                } else if (data.error) {
                    container.innerHTML += `
                        <div class="message-wrapper bot">
                            <div class="sender-tag">JARVIS CORE</div>
                            <div class="message">API Error: ${escapeHtml(data.error.message)}</div>
                        </div>`;
                } else {
                    container.innerHTML += `
                        <div class="message-wrapper bot">
                            <div class="sender-tag">JARVIS CORE</div>
                            <div class="message">Gagal memproses respons server.</div>
                        </div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `
                    <div class="message-wrapper bot">
                        <div class="sender-tag">JARVIS CORE</div>
                        <div class="message">Kesalahan koneksi jaringan.</div>
                    </div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
